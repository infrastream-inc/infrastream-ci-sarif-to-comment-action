name: "\U0001F500 Infrastream Bot"
run-name: ""
"on":
  issue_comment:
    types:
      - created
  issues:
    types:
      - opened
      - reopened
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created
jobs:
  debugger:
    runs-on:
      - ubuntu-latest
    steps:
      - name: Print context for debugging
        run: env | grep '^DEBUG_'
        env:
          DEBUG_event: ${{ toJSON(github.event) }}
          DEBUG_event__action: ${{ github.event.action }}
          DEBUG_event__comment__author_association: ${{ github.event.comment.author_association }}
          DEBUG_event__issue__author_association: ${{ github.event.issue.author_association }}
          DEBUG_event__pull_request__author_association: ${{ github.event.pull_request.author_association }}
          DEBUG_event__review__author_association: ${{ github.event.review.author_association }}
          DEBUG_event_name: ${{ github.event_name }}
    permissions:
      contents: read
    if: ${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
  dispatch:
    runs-on:
      - ubuntu-latest
    steps:
      - id: extract-command
        name: Extract Command
        uses: actions/github-script@v9
        with:
          script: |2
            const request = process.env.REQUEST || '';
            const eventType = process.env.EVENT_TYPE;
            const isDraft = process.env.IS_DRAFT === 'true';
            core.setOutput('request', request);

            // helper and review are independent: a pull request is documented AND reviewed.
            // Routing both through a single 'command' output meant the review job could never
            // run on a pull_request event, because that event always resolved to 'helper' --
            // which is why the review job had never once executed.
            const prEvents = [
              'pull_request.opened',
              'pull_request.reopened',
              'pull_request.synchronize',
              'pull_request.ready_for_review',
            ];
            const isPullRequest = prEvents.includes(eventType);

            let runHelper = false;
            let runReview = false;

            if (request.startsWith("@infrastream-bot /review")) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.replace(/^@infrastream-bot \/review/, '').trim());
              runReview = true;                      // asked for explicitly, so drafts included
            } else if (isPullRequest) {
              core.setOutput('command', 'helper');
              runHelper = true;
              // Drafts churn: reviewing every push to one spends tokens on code the author is
              // still moving. ready_for_review picks it up the moment it becomes real.
              runReview = !isDraft;
            } else {
              core.setOutput('command', 'fallthrough');
            }

            core.setOutput('run_helper', String(runHelper));
            core.setOutput('run_review', String(runReview));
        env:
          EVENT_TYPE: ${{ github.event_name }}.${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          REQUEST: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
      - name: Acknowledge request
        run: gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          MESSAGE: "\U0001F916 Hi @${{ github.actor }}, I've received your request, and I'm working on it now! You can track my progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details."
          REPOSITORY: ${{ github.repository }}
    outputs:
      additional_context: ${{ steps.extract-command.outputs.additional_context }}
      command: ${{ steps.extract-command.outputs.command }}
      issue_number: ${{ github.event.pull_request.number || github.event.issue.number }}
      request: ${{ steps.extract-command.outputs.request }}
      run_helper: ${{ steps.extract-command.outputs.run_helper }}
      run_review: ${{ steps.extract-command.outputs.run_review }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: |2-
      (
      	github.event_name == 'pull_request' &&
      	github.event.pull_request.head.repo.fork == false
      ) || (
      	github.event.sender.type == 'User' &&
      	startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body, '@infrastream-bot') &&
      	contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      ) || (
      	github.event_name == 'issues' &&
      	contains(fromJSON('["opened", "reopened"]'), github.event.action)
      )
  fallthrough:
    runs-on:
      - ubuntu-latest
    steps:
      - id: rerun-failed
        name: Retry Failed Jobs
        run: gh run rerun ${{ github.run_id }} --failed -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        if: needs.dispatch.outputs.command != 'fallthrough' && fromJSON(github.run_attempt) < 2
      - name: Send failure comment
        run: gh issue comment "${ISSUE_NUMBER}" --body "${MESSAGE}" --repo "${REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          MESSAGE: "\U0001F916 I'm sorry @${{ github.actor }}, but I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details"
          REPOSITORY: ${{ github.repository }}
        if: needs.dispatch.outputs.command == 'fallthrough' || fromJSON(github.run_attempt) >= 2
    needs:
      - debugger
      - dispatch
      - helper
      - review
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    if: ${{ always() && !cancelled() && (needs.dispatch.result == 'failure' || needs.debugger.result == 'failure' || needs.helper.result == 'failure' || needs.dispatch.outputs.command == 'fallthrough') }}
  helper:
    needs:
      - dispatch
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    if: ${{ needs.dispatch.outputs.run_helper == 'true' }}
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit
    uses: pvotal-tech/default-managed-workflows-private/.github/workflows/ai-helper-pull_request.yml@main
  review:
    needs:
      - dispatch
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: ${{ needs.dispatch.outputs.run_review == 'true' }}
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit
    uses: pvotal-tech/default-managed-workflows-private/.github/workflows/ai-review-pull_request.yml@main
permissions:
  actions: write
  contents: read
  id-token: write
  issues: write
  pull-requests: write
defaults:
  run:
    shell: bash
